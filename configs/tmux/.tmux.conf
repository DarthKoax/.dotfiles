#Rebind the prefix
unbind C-b
set-option -g prefix C-b
bind-key C-b send-prefix

set-option -g base-index 1
set-option -g pane-base-index 1


#bind C-s new-session
#bind-key A-1 select-layout main-vertical
#bind-key @ select-layout even-vertical 
#bind-key $ select-layout main-horizontal
#bind-key % select-layout tiled

#bind-key T \
  # split-window -h \; \
  # split-window -v \; \
  # select-pane -U \; \
  # split-window -v

#set history
set-option -g history-limit 50000
set -g display-time 1000

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

set -g default-terminal "tmux-256color"
# set-option -ga terminal-overrides ",xterm-256color:Tc"
# set-option -ga terminal-overrides ",xterm*:RGB,alacritty:RGB,xterm-kitty:RGB"
set-option -ga terminal-overrides ",*:RGB"


# bind a setw synchronize-panes \; display "Panes Synhronized" \; run-shell '~/dotfiles/bin/toggle_colour_scheme'
bind r source-file ~/.tmux.conf \; display "Reloaded!..."

## Kill all other sessions
bind C-q kill-session -a \; display "Killed all other open sessions"

# Enable copy mode when scrolling with the mouse
bind -T copy-mode-vi WheelUpPane send -X -N 3 scroll-up
bind -T copy-mode-vi WheelDownPane send -X -N 3 scroll-down
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M

RED="#dc322f"
GREEN="#859900"
YELLOW="#b58900"
BLUE="#268bd2"
MAGENTA="#d33682"
CYAN="#2aa198"
BLACK="#073642"
DARK_GRAY="#586e75"
LIGHT_GRAY="#93a1a1"
BG="#002B36"
FG="#839496"

HALF_ROUND_OPEN="#(printf '\uE0B6')"
HALF_ROUND_CLOSE="#(printf '\uE0B4')"
TRIANGLE_OPEN="#(printf '\uE0B0')"
TRIANGLE_CLOSE="#(printf '\uE0B2')"

# Define default statusbar colors
# set-option -g status-style fg=colour136,\bg=black # sets the default status line colors
# Define the window status colors
#https://upload.wikimedia.org/wikipedia/commons/1/15/Xterm_256color_chart.svg
# set-window-option -g window-status-style fg=colour138,bg=default # default window status
# set-window-option -g window-status-current-style fg=colour118,bg=default # current window status
# set-window-option -g window-status-activity-style fg=colour138,bg=default # window with activity

# # Define the pane border colors
# set-option -g pane-border-style fg=colour235,bg=default
# set-option -g pane-active-border-style fg=colour51,bg=default


# # To enable vim keybindings in copy mode
# setw -g mode-keys vi
# # Setup 'v' to begin selection as in Vim
# bind-key -T copy-mode-vi v send -X begin-selection
# # Setup 'y' to copy selection and still remain in copy mode, similar to Vim
# bind-key -T copy-mode-vi y send -X copy-selection
# # Allow word navigation like in shell
# bind-key -T copy-mode-vi C-Left send-keys -X previous-word
# bind-key -T copy-mode-vi C-Right send-keys -X next-word

set-option -g popup-style "bg=${BG},fg=${FG}"
# set-option -g popup-border-style "fg=${CYAN},bg=${BLACK}"
# set-option -g popup-border-lines rounded

# Define popups
bind-key p display-popup -w 80% -h 70% \
  -b "rounded" \
  -s "fg=${FG},bg=${BG}" \
  -S "fg=${CYAN},bg=${BG}" \
  -T "#[fg=${YELLOW},bg=${BG}] Popup " \
  -E


# Toggle persistent popup terminal with Alt + 3 (No prefix needed due to -n)
bind-key -n M-3 if-shell -F '#{==:#{session_name},popup}' {
    detach-client
} {
    display-popup -d "#{pane_current_path}" -xC -yC -w 90% -h 90% -E 'tmux attach-session -t popup || tmux new-session -s popup'
}


# bind-key p display-popup -w 80% -h 70% -E
bind-key ` display-popup -w 80% -h 80% \
  -b "rounded" \
  -s "fg=${FG},bg=${BG}" \
  -S "fg=${CYAN},bg=${BG}" \
  -T "#[fg=${YELLOW},bg=${BG}] Basin " \
  -E 'bash -c "exec /home/koax/code/basin/main"'


# Basic colors of the Statusbar
set-option -g status-style bg=${BLACK},fg=${FG}

# Show the window list centered between the left and the right section
set-option -g status-justify centre
# Style and set contents on the left section
set-option -g status-left "\
#[fg=${BG},bg=default]\
#[bg=${BG},fg=${YELLOW},bold] #S \
#[fg=${BG},bg=default,nobold]${TRIANGLE_OPEN}\
"

# Style and set contents on the right section
set-option -g status-right "\
#[fg=${BG},bg=default]${TRIANGLE_CLOSE}\
#[bg=${BG},fg=${CYAN}] #h \
#[fg=${BG},bg=default]\
"

# Set max length of left and right section
set-option -g status-left-length 100
set-option -g status-right-length 100

# Style and set content for the inactive windows
set-option -g window-status-format "\
 \
#I\
#[fg=${MAGENTA}]:\
#[fg=default]#W\
 \
"

# Style and set content for the active windows
set-option -g window-status-current-format "\
#[fg=${BG},bg=default]${HALF_ROUND_OPEN}\
#[bg=${BG},fg=${LIGHT_GRAY}]#I\
#[fg=${RED}]:\
#[fg=${LIGHT_GRAY}]#W\
#[fg=${BG},bg=default]${HALF_ROUND_CLOSE}\
"

# Remove the separator between window list items, as we already have spacing
# "around" inactive items
set-option -g window-status-separator ""

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'graemedavidson/tmux-pane-focus'
set -g @pane_focus_size '99%'

run '~/.tmux/plugins/tpm/tpm'